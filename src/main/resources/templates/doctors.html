<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Doctor Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Doctor Management
    </h2>

    <div class="mb-3">
        <a href="/" class="btn btn-secondary">← Dashboard</a>
    </div>

    <form id="doctorForm">

        <div class="row g-2">

            <div class="col-md-3">
                <input type="text" id="name" class="form-control"
                       placeholder="Doctor Name" required>
            </div>

            <div class="col-md-3">
                <input type="text" id="specialization" class="form-control"
                       placeholder="Specialization" required>
            </div>

            <div class="col-md-2">
                <input type="text" id="phone" class="form-control"
                       placeholder="Phone" required>
            </div>

            <div class="col-md-2">
                <input type="number" id="experience" class="form-control"
                       placeholder="Experience" required>
            </div>

            <div class="col-md-2">
                <button id="submitBtn" class="btn btn-primary w-100">
                    Add Doctor
                </button>
            </div>

        </div>

    </form>

    <hr>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Phone</th>
            <th>Experience</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody id="doctorTable">

        </tbody>

    </table>

</div>

<script>

    let editingId = null;

    loadDoctors();

    function loadDoctors(){

    fetch("/doctors")

    .then(res=>res.json())

    .then(data=>{

    let rows="";

    data.forEach(d=>{

    rows+=`

    <tr>

    <td>${d.id}</td>

    <td>${d.name}</td>

    <td>${d.specialization}</td>

    <td>${d.phone}</td>

    <td>${d.experience}</td>

    <td>

    <button class="btn btn-warning btn-sm"
    onclick="editDoctor(${d.id},
    '${d.name}',
    '${d.specialization}',
    '${d.phone}',
    ${d.experience})">

    Edit

    </button>

    <button class="btn btn-danger btn-sm ms-2"
    onclick="deleteDoctor(${d.id})">

    Delete

    </button>

    </td>

    </tr>

    `;

    });

    document.getElementById("doctorTable").innerHTML=rows;

    });

    }

    document.getElementById("doctorForm").addEventListener("submit",function(e){

    e.preventDefault();

    const doctor={

    name:document.getElementById("name").value,
    specialization:document.getElementById("specialization").value,
    phone:document.getElementById("phone").value,
    experience:document.getElementById("experience").value

    };

    if(editingId==null){

    fetch("/doctors",{

    method:"POST",

    headers:{
    "Content-Type":"application/json"
    },

    body:JSON.stringify(doctor)

    })

    .then(()=>{

    this.reset();

    loadDoctors();

    });

    }else{

    fetch("/doctors/"+editingId,{

    method:"PUT",

    headers:{
    "Content-Type":"application/json"
    },

    body:JSON.stringify(doctor)

    })

    .then(()=>{

    this.reset();

    editingId=null;

    document.getElementById("submitBtn").innerHTML="Add Doctor";

    loadDoctors();

    });

    }

    });

    function editDoctor(id,name,specialization,phone,experience){

    editingId=id;

    document.getElementById("name").value=name;
    document.getElementById("specialization").value=specialization;
    document.getElementById("phone").value=phone;
    document.getElementById("experience").value=experience;

    document.getElementById("submitBtn").innerHTML="Update Doctor";

    }

    function deleteDoctor(id){

    if(confirm("Delete this doctor?")){

    fetch("/doctors/"+id,{

    method:"DELETE"

    })

    .then(()=>loadDoctors());

    }

    }

</script>

</body>
</html>
