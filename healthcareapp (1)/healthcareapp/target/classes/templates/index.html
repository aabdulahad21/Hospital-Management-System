<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>HealthCare Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🏥 HealthCare Application
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Hospital Management Dashboard
    </h2>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1 id="patientCount">0</h1>
                    <h5>Patients</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1 id="doctorCount">0</h1>
                    <h5>Doctors</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1 id="appointmentCount">0</h1>
                    <h5>Appointments</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1 id="medicineCount">0</h1>
                    <h5>Medicines</h5>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-5">

    <div class="row text-center">

        <div class="col-md-3 mb-3">
            <a href="/patients-page" class="btn btn-primary w-100">
                Manage Patients
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="/doctors-page" class="btn btn-success w-100">
                Manage Doctors
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="/appointments-page" class="btn btn-warning w-100">
                Appointments
            </a>
        </div>

        <div class="col-md-3 mb-3">
            <a href="/medicines-page" class="btn btn-danger w-100">
                Pharmacy
            </a>
        </div>

    </div>

</div>

<script>
    fetch("/dashboard")
        .then(response => response.json())
        .then(data => {

            document.getElementById("patientCount").innerHTML = data.totalPatients;
            document.getElementById("doctorCount").innerHTML = data.totalDoctors;
            document.getElementById("appointmentCount").innerHTML = data.totalAppointments;
            document.getElementById("medicineCount").innerHTML = data.totalMedicines;

        });
</script>

</body>
</html>
