<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Patient Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Patient Management
    </h2>

    <div class="mb-3">
        <a href="/" class="btn btn-secondary">← Dashboard</a>
    </div>

    <form id="patientForm">

        <div class="row">

            <div class="col-md-3">
                <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Patient Name"
                        required>
            </div>

            <div class="col-md-2">
                <input
                        type="number"
                        id="age"
                        class="form-control"
                        placeholder="Age"
                        required>
            </div>

            <div class="col-md-2">
                <input
                        type="text"
                        id="gender"
                        class="form-control"
                        placeholder="Gender"
                        required>
            </div>

            <div class="col-md-3">
                <input
                        type="text"
                        id="phone"
                        class="form-control"
                        placeholder="Phone"
                        required>
            </div>

            <div class="col-md-2">
                <button id="submitBtn" class="btn btn-primary w-100">
                    Add Patient
                </button>
            </div>

        </div>

    </form>

    <hr>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody id="patientTable">

        </tbody>

    </table>

</div>

<script>

    let editingId = null;

    loadPatients();

    function loadPatients() {

        fetch("/patients")
            .then(response => response.json())
            .then(data => {

                let rows = "";

                data.forEach(p => {

                    rows += `
                    <tr>

                        <td>${p.id}</td>

                        <td>${p.name}</td>

                        <td>${p.age}</td>

                        <td>${p.gender}</td>

                        <td>${p.phone}</td>

                        <td>

                            <button
                                class="btn btn-warning btn-sm"
                                onclick="editPatient(${p.id},
                                '${p.name}',
                                ${p.age},
                                '${p.gender}',
                                '${p.phone}')">

                                Edit

                            </button>

                            <button
                                class="btn btn-danger btn-sm ms-2"
                                onclick="deletePatient(${p.id})">

                                Delete

                            </button>

                        </td>

                    </tr>
                    `;

                });

                document.getElementById("patientTable").innerHTML = rows;

            });

    }

    document.getElementById("patientForm").addEventListener("submit", function (e) {

        e.preventDefault();

        const patient = {

            name: document.getElementById("name").value,
            age: document.getElementById("age").value,
            gender: document.getElementById("gender").value,
            phone: document.getElementById("phone").value

        };

        if (editingId == null) {

            fetch("/patients", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(patient)

            })
            .then(() => {

                this.reset();
                loadPatients();

            });

        } else {

            fetch("/patients/" + editingId, {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(patient)

            })
            .then(() => {

                this.reset();

                editingId = null;

                document.getElementById("submitBtn").innerHTML = "Add Patient";

                loadPatients();

            });

        }

    });

    function editPatient(id, name, age, gender, phone) {

        editingId = id;

        document.getElementById("name").value = name;

        document.getElementById("age").value = age;

        document.getElementById("gender").value = gender;

        document.getElementById("phone").value = phone;

        document.getElementById("submitBtn").innerHTML = "Update Patient";

    }

    function deletePatient(id) {

        if (confirm("Delete this patient?")) {

            fetch("/patients/" + id, {

                method: "DELETE"

            })
            .then(() => {

                loadPatients();

            });

        }

    }

</script>

</body>

</html>
